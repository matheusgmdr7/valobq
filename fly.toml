app = 'valobq'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    NEXT_PUBLIC_SUPABASE_URL = 'https://tgrhgkqpqsnkhewnmarr.supabase.co'
    NEXT_PUBLIC_SUPABASE_ANON_KEY = 'sb_publishable_CW4rcYaZZxqtq0MlQpB3ZQ_uTWCYbvE'
    NEXT_PUBLIC_MARKET_DATA_WS_URL = 'wss://valoren-market.fly.dev'
    NEXT_PUBLIC_APP_URL = 'https://valorenbroker.com'

[env]
  NODE_ENV = 'production'
  NEXT_TELEMETRY_DISABLED = '1'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
